name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sA "Mozilla/5.0" https://www.vlr.gg/matches/results -o r.html
          python3 - <<'PY'
          import re
          p=open('r.html').read()
          i=p.find('match-item')
          print(p[i-300:i+4000])
          print('EVENTS:', sorted(set(re.findall(r'match-item-event-series[^>]*>\s*([^<]+)', p)))[:20])
          print('CHAMP count', p.count('Champions'))
          PY
