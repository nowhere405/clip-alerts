name: Check for new clips

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test message to Discord instead of checking"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-clips
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: pip install --quiet --upgrade yt-dlp
      - name: Check platforms
        env:
          SEND_TEST: ${{ inputs.send_test }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_CHANNEL: ${{ secrets.YOUTUBE_CHANNEL }}
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TIKTOK_RSS_URL: ${{ secrets.TIKTOK_RSS_URL }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python check.py
      - name: Save what was seen
        if: always()
        run: |
          git config user.name "clip-alerts"
          git config user.email "clip-alerts@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update seen clips" && git push)
